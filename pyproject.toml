[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "optimization-explorer"
version = "1.1.0"
description = "Source and binary metadata compiler optimization discovery with LangGraph and LiteLLM"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.3,<2", "litellm>=1.60,<2", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.14,<1"]
[project.scripts]
optimization-explorer = "optimization_explorer.cli:main"
[tool.setuptools.packages.find]
include = ["optimization_explorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["results", "sources"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
